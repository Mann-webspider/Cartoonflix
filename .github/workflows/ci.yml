name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-backend/package-lock.json
      - run: npm ci
      - run: npm test --if-present

  user-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: user-backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... 2>/dev/null || true

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, user-frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
